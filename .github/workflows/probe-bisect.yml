name: probe-bisect

# Copyright (C) 2026 The Gesher HaMeitarim Authors (גשר המיתרים); SPDX-License-Identifier: LicenseRef-PolyForm-Strict-1.0.0
# איתור רגרסיה: בונה את posix_probe רק, מענף או קומיט שמצוינים, ומריץ אותו על Windows שלוש פעמים.
# במקום ריצה מלאה של ci.yml (שעה וחצי), זה לוקח כרבע שעה, ואפשר להריץ כמה ענפים במקביל:
#   gh workflow run probe-bisect.yml --ref bisect/workflow -f ref=topic/pr-256
# זה כלי אבחון בלבד. הוא לא קובע אם גרסה מוכנה, ולא מחליף את ci.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'הענף או הקומיט לבדיקה'
        required: true

permissions:
  contents: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: echo "PROBE_BISECT_REF ref=${{ inputs.ref }} sha=$(git rev-parse HEAD)"
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: runtime
      - name: Build posix_probe
        run: ninja -C out posix_probe
      - uses: actions/upload-artifact@v4
        with:
          name: posix-probe
          path: |
            out/posix_probe.exe
            out/*.dll
          if-no-files-found: error

  test:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: posix-probe
          path: probe
      - name: Run posix_probe three times
        shell: pwsh
        run: |
          $failed = 0
          for ($i = 1; $i -le 3; $i++) {
            $out = & "$PWD/probe/posix_probe.exe" 2>&1 | Out-String
            $code = $LASTEXITCODE
            "PROBE_RUN os=${{ matrix.os }} run=$i exit=$code"
            $out -split "`r?`n" | Where-Object { $_ -match '^FAIL|all passed|inotify routing|local-write routing' } | ForEach-Object { "  $_" }
            if ($code -ne 0) { $failed++ }
          }
          "PROBE_SUMMARY os=${{ matrix.os }} failed_runs=$failed of 3"
          if ($failed -ne 0) { exit 1 }
