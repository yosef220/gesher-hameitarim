name: Publish Gesher release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # גשר המיתרים: פרסום ידני של ריצת CI על תג שכבר הצליחה, כשהפרסום האוטומטי שלה לא הושלם
  # (למשל, כשהמפרסם תוקן אחריה). כל הבדיקות של המפרסם חלות גם כאן, על הריצה כפי ש-GitHub מחזיר אותה.
  #   gh workflow run publish-release.yml --ref main -f ci_run_id=<מספר הריצה של ci.yml על התג>
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'מספר הריצה של ci.yml על התג'
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: >-
      github.repository == 'yosef220/gesher-hameitarim' &&
      github.workflow_ref == 'yosef220/gesher-hameitarim/.github/workflows/publish-release.yml@refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || (
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-24.04
    # About 30 GitHub reads. One may wait up to 61 minutes for the published
    # hourly quota reset, after which the quota is fresh.
    timeout-minutes: 81
    concurrency:
      group: gesher-release-publish
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            tools/ci
            tools/surface
      - name: Verify and publish the exact tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 tools/ci/publish_release.py
